name: Sync BLD letter pairs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dictionary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Google Sheet and validate all 576 pairs
        run: python3 scripts/sync_sheet.py
      - name: Commit changes only when the sheet differs
        run: |
          if git diff --quiet -- sheet-dictionary.json; then
            echo "Dictionary already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet-dictionary.json
          git commit -m "Sync BLD letter pairs from Google Sheets"
          git push
